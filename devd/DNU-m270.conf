# --- DYNAMIC HOTPLUGGING FOR ALL M270 VIRTUAL INTERFACES ---

# Catch LINK_UP events for ix0.* and ix1.*
notify 100 {
    match "system"    "IFNET";
    match "subsystem" "^ix[01]\.[0-9]+$";
    match "type"      "LINK_UP";
    # Instantly clear any stale defaults and cleanly reload native networking for this sub-interface
    action "route delete default; /etc/rc.d/netif quietstart $subsystem";
};

# Catch LINK_DOWN events for ix0.* and ix1.*
notify 100 {
    match "system"    "IFNET";
    match "subsystem" "^ix[01]\.[0-9]+$";
    match "type"      "LINK_DOWN";
    # Stop DHCP (if active), wipe the default route, and strip stale addresses to prevent routing conflicts
    action "/etc/rc.d/dhclient stop $subsystem; route delete default; ifconfig $subsystem inet 0.0.0.0 delete; ifconfig $subsystem down";
};

# =====================================================================
# WINDOWS-STYLE SEAMLESS ANY-PORT HOTPLUGGING FOR WATCHGUARD M270
# =====================================================================

# 1. When a cable is CONNECTED to ANY port:
# We keep watching the virtual adapters because when the hardware links up,
# the virtual profiles natively hear it and try to initialize.
notify 100 {
    match "system"    "IFNET";
    match "subsystem" "^ix[0-1]\.[0-9]+$";
    match "type"      "LINK_UP";
    action "ifconfig $subsystem up; route delete default; /etc/rc.d/dhclient quietstart $subsystem";
};

# 2. When a cable is PULLED from an ix0 port (Physical Ports 1-4):
# We intercept the physical parent 'ix0' link state change to flush the ix0 stack.
notify 100 {
    match "system"    "IFNET";
    match "subsystem" "ix0";
    match "type"      "LINK_DOWN";
    action "logger 'M270: ix0 Link Down Detected - Flushing child routes'; \
            for v in 11 12 13 14; do \
                /etc/rc.d/dhclient stop ix0.$v; \
                ifconfig ix0.$v inet 0.0.0.0 delete; \
            done; \
            route delete default";
};

# 3. When a cable is PULLED from an ix1 port (Physical Ports 5-8):
# We intercept the physical parent 'ix1' link state change to flush the ix1 stack.
notify 100 {
    match "system"    "IFNET";
    match "subsystem" "ix1";
    match "type"      "LINK_DOWN";
    action "logger 'M270: ix1 Link Down Detected - Flushing child routes'; \
            for v in 15 16 17 18; do \
                /etc/rc.d/dhclient stop ix1.$v; \
                ifconfig ix1.$v inet 0.0.0.0 delete; \
            done; \
            route delete default";
};
